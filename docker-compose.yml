services:
  hub:
    build: ./hub
    image: synchub-hub
    container_name: synchub-hub
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      DB_PATH: /data/synchub.sqlite
      RELAY_STORE_DIR: /data/relay-store
    volumes:
      - synchub-data:/data

volumes:
  synchub-data:

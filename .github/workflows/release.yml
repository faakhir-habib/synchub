name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build SEA binary (${{ matrix.asset }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: synchub-agent-linux-x64
          - os: macos-13
            asset: synchub-agent-macos-x64
          - os: macos-14
            asset: synchub-agent-macos-arm64
          - os: windows-latest
            asset: synchub-agent-win-x64.exe
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm via corepack
        run: corepack enable pnpm && corepack prepare pnpm@9.15.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build SEA binary
        run: pnpm --filter @synchub/agent build:sea

      - name: Stage and rename binary to release asset name
        shell: bash
        run: |
          mkdir -p staging
          if [ "${{ runner.os }}" = "Windows" ]; then
            src="apps/agent/dist/sea/synchub-agent.exe"
          else
            src="apps/agent/dist/sea/synchub-agent"
          fi
          cp "$src" "staging/${{ matrix.asset }}"
          chmod +x "staging/${{ matrix.asset }}"

      - name: Smoke test binary (--version)
        shell: bash
        run: |
          set -o pipefail
          # Must exit 0 AND print a version — a broken SEA build fails CI here, not users.
          if ! out="$(./staging/${{ matrix.asset }} --version)"; then
            echo "::error::--version exited non-zero"
            exit 1
          fi
          echo "version output: $out"
          if [ -z "$out" ]; then
            echo "::error::--version produced no output"
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: staging/${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
          merge-multiple: true

      - name: List downloaded assets
        run: ls -la dist-artifacts

      - name: Compute SHA256 checksums
        shell: bash
        working-directory: dist-artifacts
        run: sha256sum * > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist-artifacts/synchub-agent-linux-x64
            dist-artifacts/synchub-agent-macos-x64
            dist-artifacts/synchub-agent-macos-arm64
            dist-artifacts/synchub-agent-win-x64.exe
            dist-artifacts/SHA256SUMS.txt
